services:

  web:
    build: .
    image: web
    container_name: web
    ports:
      - 5004:5000
    command: python manage.py run -h 0.0.0.0
    volumes:
      - .:/usr/src/app
    environment:
      - ENV=dev
      - FLASK_DEBUG=1
      - APP_SETTINGS=conf.settings.FlaskDevelopmentConfig
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      - GEOCODE_EARTH_API_KEY=${GEOCODE_EARTH_API_KEY}
      - GEOCODIO_API_KEY=${GEOCODIO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_LANGUAGE_KEY=${AZURE_LANGUAGE_KEY:-}
    depends_on:
      - redis
      - neo4j

  worker:
    build: .
    command: celery --app worker.workflows.celery worker --loglevel=info
    volumes:
      - .:/usr/src/app
    environment:
      - ENV=dev
      - FLASK_DEBUG=1
      - APP_SETTINGS=conf.settings.FlaskDevelopmentConfig
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      - GEOCODE_EARTH_API_KEY=${GEOCODE_EARTH_API_KEY}
      - GEOCODIO_API_KEY=${GEOCODIO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_LANGUAGE_KEY=${AZURE_LANGUAGE_KEY:-}
    depends_on:
      - web
      - redis
      - neo4j

  redis:
    image: redis:6-alpine

  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j-local
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/conf

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_conf: